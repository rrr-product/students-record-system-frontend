<div class="row">
  <div class="col-12 col-md-8 offset-md-2">
    <p-card [header]="isEditMode ? 'Edit Mentor' : 'Create Mentor(s)'">
      <div class="table-responsive">
        <table class="table table-bordered align-middle">
          <thead class="table-light">
            <tr>
              <th style="width: 50px;">#</th>
              <th>Mentor Name</th>
              <th>Email Address</th>
              <th style="width: 120px;">Staff?</th>
              @if(!isEditMode){
              <th style="width: 80px;" class="text-center">Actions</th>
              }
            </tr>
          </thead>
          <tbody>
            @for (mentor of mentorsList; track $index; let i = $index){
            <tr>
              <td class="text-center font-monospace">{{ i + 1 }}</td>
              <td>
                <input [id]="'name' + i" type="text" pInputText [(ngModel)]="mentor.name" placeholder="Enter name"
                  class="w-100" />
              </td>
              <td>
                <input [id]="'email' + i" type="email" pInputText [(ngModel)]="mentor.email"
                  placeholder="email@example.com" class="w-100" />
              </td>
              <td class="text-center">
                <p-checkbox [(ngModel)]="mentor.isExistingStaff" [binary]="true"
                  [inputId]="'isExistingStaff' + i"></p-checkbox>
              </td>
              @if(!isEditMode){
              <td class="text-center">
                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [text]="true"
                  (onClick)="removeMentorRow(i)" [disabled]="mentorsList.length === 1" pTooltip="Remove row"></p-button>
              </td>
              }
            </tr>
            }
          </tbody>
        </table>
      </div>

      @if(!isEditMode){
      <div class="mt-3 d-flex justify-content-center">
        <p-button label="Add Another Mentor" icon="pi pi-plus" [text]="true" severity="info"
          (onClick)="addMentorRow()"></p-button>
      </div>
      }
      <ng-template pTemplate="footer">
        <div class="d-flex justify-content-between align-items-center">
          @if (!isEditMode){
          <div class="text-secondary small">
            Total Mentors: <strong>{{ mentorsList.length }}</strong>
          </div>
          }
          <div class="d-flex gap-2 ms-auto">
            <p-button label="Cancel" severity="secondary" routerLink="/lookup/mentors"></p-button>
            <p-button [label]="isEditMode ? 'Save Changes' : 'Save All Mentors'" icon="pi pi-check" (onClick)="save()"
              [disabled]="!isFormValid()"></p-button>
          </div>
        </div>
      </ng-template>
    </p-card>
  </div>
</div>
