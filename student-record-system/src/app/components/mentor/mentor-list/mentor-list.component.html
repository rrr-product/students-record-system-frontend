<div class="row">
  <div class="col-12">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div class="d-flex align-items-center gap-2">
        <p-button icon="pi pi-arrow-left" [text]="true" routerLink="/lookup" severity="secondary"></p-button>
        <h2 class="m-0">Mentors</h2>
      </div>
      <p-button label="Create Mentor" icon="pi pi-plus" routerLink="/lookup/mentors/create"></p-button>
    </div>

    <p-card>
      <p-table [value]="(mentors$ | async) || []" [tableStyle]="{ 'min-width': '50rem' }" styleClass="p-datatable-striped">
        <ng-template pTemplate="header">
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Staff</th>
            <th style="width: 15rem">Actions</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-mentor>
          <tr>
            <td>{{mentor.name}}</td>
            <td>{{mentor.email}}</td>
            <td>
              <span class="badge" [ngClass]="mentor.isExistingStaff ? 'bg-success' : 'bg-secondary'">
                {{ mentor.isExistingStaff ? 'Yes' : 'No' }}
              </span>
            </td>
            <td>
              <div class="d-flex gap-2">
                <p-button icon="pi pi-eye" severity="info" [rounded]="true" [text]="true" [routerLink]="['/lookup/mentors/view', mentor.id]"></p-button>
                <p-button icon="pi pi-pencil" severity="success" [rounded]="true" [text]="true" [routerLink]="['/lookup/mentors/edit', mentor.id]"></p-button>
                <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [text]="true" (onClick)="deleteMentor(mentor.id)"></p-button>
              </div>
            </td>
          </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
          <tr>
            <td colspan="4" class="text-center p-4">No mentors found. Create a new mentor to get started.</td>
          </tr>
        </ng-template>
      </p-table>
    </p-card>
  </div>
</div>
